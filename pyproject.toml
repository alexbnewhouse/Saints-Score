[project]
name = "saints-score"
version = "0.1.0"
description = "Saints Score: quantifying attacker canonization in online extremist communities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alex", email = "alex@colorado.edu" }]

dependencies = [
    # Core
    "polars>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandera[polars]>=0.20",
    "click>=8.1",
    "loguru>=0.7",
    # NLP / ML
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "accelerate>=0.30",
    # Stats
    "pymc>=5.15",
    "arviz>=0.18",
    "scipy>=1.13",
    "numpy>=1.26",
    # Mention detection
    "rapidfuzz>=3.8",
    # Viz
    "matplotlib>=3.8",
    "plotnine>=0.13",
    "seaborn>=0.13",
    # Utilities
    "tomli>=2.0; python_version < '3.11'",
    "tqdm>=4.66",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
gpu = [
    "vllm>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saints_score"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
ignore = [
    "E501",     # line too long (handled by formatter)
    "N803",     # argument name should be lowercase — math convention (C, X)
    "N806",     # variable name should be lowercase — math convention (N, X, Y, C_fit)
    "RUF001",   # ambiguous unicode in strings — intentional (α etc.)
    "RUF002",   # ambiguous unicode in docstrings — intentional (×, ×)
    "RUF003",   # ambiguous unicode in comments — intentional (×)
]

[tool.ruff.lint.isort]
known-first-party = ["saints_score"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "polars.*",
    "pyarrow.*",
    "pandera.*",
    "transformers.*",
    "sentence_transformers.*",
    "torch.*",
    "pymc.*",
    "arviz.*",
    "rapidfuzz.*",
    "plotnine.*",
    "loguru.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
]
